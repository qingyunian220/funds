<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>基金C份额收益率排名</title>
  <link rel="stylesheet" href="/static/layui-v2.11.6/layui/css/layui.css">
  <style>
    /* 全局样式，去除默认外边距 */
    body {
      margin: 0;
      padding: 0;
    }
    /* 自定义样式，使页面适应不同屏幕尺寸 */
    .layui-container {
      width: 100%;
      padding: 0 15px;
      box-sizing: border-box;
    }

    /* 表格容器：超出时在容器内滚动，不影响整页 */
    .table-scroll-container {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-bottom: 10px;
    }
    
    /* 在小屏幕上调整列宽 */
    @media screen and (max-width: 1200px) {
      .layui-table th, .layui-table td {
        font-size: 12px;
        padding: 9px 5px;
      }
    }
    
    @media screen and (max-width: 992px) {
      .layui-table th, .layui-table td {
        padding: 9px 3px;
      }
    }
    
    /* 近1年前十名基金标色 */
    .top-10 {
      background-color: #ffeb3b !important;
      font-weight: bold;
    }
    
    /* 负数显示为绿色 */
    .negative-number {
      color: #16b777 !important;
      font-weight: bold;
    }
    
    /* 正数显示为红色 */
    .positive-number {
      color: #ff5722 !important;
      font-weight: bold;
    }
    
    /* 标题区域样式 */
    .title-container {
      display: flex;
      align-items: center;
      margin-top: 20px;
    }
    .title-container h1 {
      margin-left: 15px;
    }
    
    /* 修改标题容器样式，使标题居中 */
    .layui-field-title {
      position: relative;
    }
    
    .title-content {
      position: relative;
      width: 100%;
      height: 80px;
    }
    
    .back-button {
      position: absolute;
      left: 0;
      top: 0;
    }
    .export-button {
      position: absolute;
      right: 0;
      top: 0;
    }
    
    .title-center {
      position: absolute;
      left: 50%;
      top: 10px;
      transform: translateX(-50%);
      margin: 0;
      text-align: center;
      width: 300px;
    }
    .date-center {
      position: absolute;
      left: 50%;
      top: 48px;
      transform: translateX(-50%);
      text-align: center;
      color: #666;
      font-size: 14px;
    }

    /* 打印样式：确保PDF导出时布局完整，图表和表格对齐 */
    @media print {
      body { background: #fff; }
      .back-button, .export-button { display: none !important; }
      .layui-container { padding: 0 !important; }
      .chart-container, .table-scroll-container { width: 100% !important; }
      .echarts-chart { width: 100% !important; height: 420px !important; }
      .layui-table { width: 100% !important; }
      .layui-table colgroup col { width: auto !important; }
      .layui-table th, .layui-table td { white-space: nowrap; }
      .layui-elem-field { page-break-inside: avoid; }
      @page { size: A4 landscape; margin: 10mm; }
    }

    /* 图表区域样式 */
    .chart-container {
      margin: 15px 0;
      text-align: center;
    }
    .chart-container .echarts-chart {
      width: 100%;
      height: 450px;
      border: 1px solid #e6e6e6;
      border-radius: 4px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .chart-placeholder {
      padding: 30px;
      color: #999;
      background-color: #f9f9f9;
      border: 1px dashed #ddd;
      border-radius: 4px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="layui-container">
    <div class="layui-row">
      <div class="layui-col-md12">
        <fieldset class="layui-elem-field layui-field-title">
          <div class="title-content">
            <div class="back-button">
              <a href="/" class="layui-btn layui-btn-primary layui-btn-sm">
                <i class="layui-icon layui-icon-left"></i> 返回首页
              </a>
            </div>
            <div class="export-button">
              <a href="/export_fund_ranking_pdf" class="layui-btn layui-btn-normal layui-btn-sm">
                <i class="layui-icon layui-icon-export"></i> 导出PDF
              </a>
            </div>
            <h1 class="title-center">指数增强超额收益报告</h1>
            <div id="reportDate" class="date-center"></div>
          </div>
        </fieldset>
      </div>
    </div>
    
    <div id="fundSections"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="/static/layui-v2.11.6/layui/layui.js"></script>
  <script>
  layui.use(function(){
    var $ = layui.$;
    var table = layui.table;
    window.echartsInstances = [];

    // 显示当前日期，格式：2026年8月18日
    var now = new Date();
    var dateStr = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日';
    document.getElementById('reportDate').textContent = dateStr;

    // 后端传入的选中基金类型列表
    var selectedTypes = {{ selected_fund_types | tojson }};

    // 全部基金配置：基金类型、基准、工作表名、图表对应的fund_type
    var allFundConfigs = [
      { id: 'hs300',       name: '沪深300基金',  benchmark: '华泰柏瑞沪深300ETF(510300)',    sheet: '沪深300基金_超额', chartType: '沪深300' },
      { id: 'zz500',       name: '中证500基金',  benchmark: '华泰柏瑞中证500ETF(512510)',    sheet: '中证500基金_超额', chartType: '中证500' },
      { id: 'a500',        name: 'A500基金',     benchmark: '华泰柏瑞中证A500ETF(563800)',   sheet: 'A500基金_超额',    chartType: 'A500' },
      { id: 'zz800',       name: '中证800基金',  benchmark: '易方达中证800ETF(515810)',     sheet: '中证800基金_超额', chartType: '中证800' },
      { id: 'zz1000',      name: '中证1000基金', benchmark: '华泰柏瑞中证1000ETF(516300)',  sheet: '中证1000基金_超额',chartType: '中证1000' },
      { id: 'zz2000',      name: '中证2000基金', benchmark: '华泰柏瑞中证2000ETF(563300)',  sheet: '中证2000基金_超额',chartType: '中证2000' },
      { id: 'gz2000',      name: '国证2000基金', benchmark: '广发国证2000ETF(159907)',      sheet: '国证2000基金_超额',chartType: '国证2000' },
      { id: 'small_fund',  name: '小微盘基金',   benchmark: '诺安多策略混合(320016)',       sheet: '小微盘_超额',      chartType: '小微盘' }
    ];

    // 只保留 SELECTED_FUND_TYPES 中包含的类型
    var fundConfigs = allFundConfigs.filter(function(config) {
      return selectedTypes.indexOf(config.chartType) !== -1;
    });

    // 动态生成各分类区块
    var sectionsHtml = '';
    fundConfigs.forEach(function(config) {
      sectionsHtml += ''
        + '<fieldset class="layui-elem-field" style="margin-top: 25px;">'
        +   '<legend>' + config.name + '</legend>'
        +   '<div class="layui-field-box">'
        +     '<div class="chart-container" id="chart_' + config.id + '"><div class="echarts-chart" id="echart_' + config.id + '"></div></div>'
        +     '<div class="table-scroll-container">'
        +       '<table class="layui-table" id="' + config.id + 'Table" lay-filter="' + config.id + 'Table"></table>'
        +     '</div>'
        +   '</div>'
        + '</fieldset>';
    });
    document.getElementById('fundSections').innerHTML = sectionsHtml;

    // 创建表格列定义
    function createTableColumns() {
      return [[
        {field: '基金代码', title: '基金代码', width: 86, align: 'center'},
        {field: '基金简称', title: '基金简称', width: 233, align: 'center'},
        {field: '近1周超额', title: '近1周超额', width: 94, align: 'center', templet: function(d) {
          var value = d['近1周超额'];
          if (value === null || value === undefined || value === '') return '';
          var formattedValue = parseFloat(value).toFixed(2) + '%';
          if (parseFloat(value) < 0) return '<span class="negative-number">' + formattedValue + '</span>';
          else if (parseFloat(value) > 0) return '<span class="positive-number">' + formattedValue + '</span>';
          return formattedValue;
        }},
        {field: '近1月超额', title: '近1月超额', width: 94,  align: 'center', templet: function(d) {
          var value = d['近1月超额'];
          if (value === null || value === undefined || value === '') return '';
          var formattedValue = parseFloat(value).toFixed(2) + '%';
          if (parseFloat(value) < 0) return '<span class="negative-number">' + formattedValue + '</span>';
          else if (parseFloat(value) > 0) return '<span class="positive-number">' + formattedValue + '</span>';
          return formattedValue;
        }},
        {field: '近3月超额', title: '近3月超额', width: 94,  align: 'center', templet: function(d) {
          var value = d['近3月超额'];
          if (value === null || value === undefined || value === '') return '';
          var formattedValue = parseFloat(value).toFixed(2) + '%';
          if (parseFloat(value) < 0) return '<span class="negative-number">' + formattedValue + '</span>';
          else if (parseFloat(value) > 0) return '<span class="positive-number">' + formattedValue + '</span>';
          return formattedValue;
        }},
        {field: '近6月超额', title: '近6月超额', width: 94,  align: 'center', templet: function(d) {
          var value = d['近6月超额'];
          if (value === null || value === undefined || value === '') return '';
          var formattedValue = parseFloat(value).toFixed(2) + '%';
          if (parseFloat(value) < 0) return '<span class="negative-number">' + formattedValue + '</span>';
          else if (parseFloat(value) > 0) return '<span class="positive-number">' + formattedValue + '</span>';
          return formattedValue;
        }},
        {field: '近1年超额', title: '近1年超额', width: 94,  align: 'center', templet: function(d) {
          var value = d['近1年超额'];
          if (value === null || value === undefined || value === '') return '';
          var formattedValue = parseFloat(value).toFixed(2) + '%';
          if (parseFloat(value) < 0) return '<span class="negative-number">' + formattedValue + '</span>';
          else if (parseFloat(value) > 0) return '<span class="positive-number">' + formattedValue + '</span>';
          return formattedValue;
        }},
        // {field: '近2年超额', title: '近2年超额', width: 94,  align: 'center', templet: function(d) {
        //   var value = d['近2年超额'];
        //   if (value === null || value === undefined || value === '') return '';
        //   var formattedValue = parseFloat(value).toFixed(2) + '%';
        //   if (parseFloat(value) < 0) return '<span class="negative-number">' + formattedValue + '</span>';
        //   else if (parseFloat(value) > 0) return '<span class="positive-number">' + formattedValue + '</span>';
        //   return formattedValue;
        // }},
        // {field: '近3年超额', title: '近3年超额', width: 94, align: 'center', templet: function(d) {
        //   var value = d['近3年超额'];
        //   if (value === null || value === undefined || value === '') return '';
        //   var formattedValue = parseFloat(value).toFixed(2) + '%';
        //   if (parseFloat(value) < 0) return '<span class="negative-number">' + formattedValue + '</span>';
        //   else if (parseFloat(value) > 0) return '<span class="positive-number">' + formattedValue + '</span>';
        //   return formattedValue;
        // }},
        {field: '今年来超额', title: '今年来超额', width: 100,  align: 'center', templet: function(d) {
          var value = d['今年来超额'];
          if (value === null || value === undefined || value === '') return '';
          var formattedValue = parseFloat(value).toFixed(2) + '%';
          if (parseFloat(value) < 0) return '<span class="negative-number">' + formattedValue + '</span>';
          else if (parseFloat(value) > 0) return '<span class="positive-number">' + formattedValue + '</span>';
          return formattedValue;
        }},
        // {field: '成立时间', title: '成立时间', width: 102, align: 'center'},
        {field: '最新规模', title: '最新规模', width: 95, align: 'center'},
        {field: '换手率', title: '换手率', width: 95, align: 'center'},
        {field: '前10大重仓股占比', title: '前10大占比', width: 105, align: 'center'},
        {field: '持股行业集中度', title: '持股行业集中度', width: 128, align: 'center', templet: function(d) {
          var value = d['持股行业集中度'];
          if (value === null || value === undefined || value === '') return '';
          var match = value.match(/(\d+\.\d+)%/);
          if (match && match[1]) return match[1] + '%';
          return value;
        }}
      ]];
    }

    // 加载超额收益曲线图和表格（使用ECharts渲染，表格基金与走势图一致）
    fundConfigs.forEach(function(config) {
      var chartDom = document.getElementById('echart_' + config.id);
      if (!chartDom) return;

      var placeholder = document.createElement('div');
      placeholder.className = 'chart-placeholder';
      placeholder.textContent = '正在加载' + config.name + '超额收益曲线...';
      chartDom.innerHTML = '';
      chartDom.appendChild(placeholder);

      fetch('/chart_data?fund_type=' + encodeURIComponent(config.chartType))
        .then(function(res) { return res.json(); })
        .then(function(res) {
          if (res.code !== 0 || !res.data) {
            chartDom.innerHTML = '<div class="chart-placeholder">暂无' + config.name + '超额收益曲线数据<br><small style="color:#bbb;">' + (res.msg || '') + '</small></div>';
            // 表格也显示无数据
            table.render({
              elem: '#' + config.id + 'Table',
              data: [],
              page: false,
              cols: createTableColumns(),
              text: '暂无数据'
            });
            return;
          }
          renderEchartsChart(chartDom, res.data, config);

          // 用走势图中的基金名称，从Excel全量数据中筛选对应的基金填充表格
          var chartFundNames = res.data.series.map(function(s) { return s.name; });
          fetch('/get_fund_data?sheet=' + encodeURIComponent(config.sheet))
            .then(function(res2) { return res2.json(); })
            .then(function(res2) {
              if (res2.code !== 0 || !res2.data) {
                table.render({
                  elem: '#' + config.id + 'Table',
                  data: [],
                  page: false,
                  cols: createTableColumns(),
                  text: '暂无数据'
                });
                return;
              }
              // 筛选出走势图中的基金，并按走势图顺序排列
              var filteredData = [];
              chartFundNames.forEach(function(name) {
                var found = res2.data.find(function(row) { return row['基金简称'] === name; });
                if (found) filteredData.push(found);
              });

              table.render({
                elem: '#' + config.id + 'Table',
                data: filteredData,
                page: false,
                cols: createTableColumns(),
                done: function() {
                  console.log(config.name + '表格渲染完成，共 ' + filteredData.length + ' 只基金');
                }
              });
            })
            .catch(function(err) {
              console.error(config.name + '表格数据加载失败:', err);
            });
        })
        .catch(function(err) {
          chartDom.innerHTML = '<div class="chart-placeholder">加载' + config.name + '曲线数据失败</div>';
        });
    });

    // ECharts渲染函数（使用时间轴，支持不同基金不同日期范围）
    function renderEchartsChart(dom, data, config) {
      var myChart = echarts.init(dom);
      var colors = ['#5470c6', '#91cc75', '#ee6666', '#fac858', '#73c0de', '#3ba272', '#fc8452', '#9a60b4'];

      // 每只基金用 [日期, 数值] 格式，支持各自不同的日期范围
      var series = data.series.map(function(s, i) {
        var points = [];
        for (var j = 0; j < s.dates.length; j++) {
          points.push([s.dates[j], s.data[j]]);
        }
        return {
          name: s.name,
          type: 'line',
          data: points,
          smooth: true,
          symbol: 'none',
          lineStyle: { width: 2 },
          itemStyle: { color: colors[i % colors.length] }
        };
      });

      // 收集所有基金的日期，取并集用于基准线
      var allDates = [];
      data.series.forEach(function(s) {
        s.dates.forEach(function(d) {
          if (allDates.indexOf(d) === -1) allDates.push(d);
        });
      });
      allDates.sort();
      var benchmarkPoints = allDates.map(function(d) { return [d, 0]; });

      // 基准线（Y=0，贯穿整个时间轴）
      series.push({
        name: data.benchmark,
        type: 'line',
        data: benchmarkPoints,
        symbol: 'none',
        lineStyle: { color: '#333', width: 1.5, type: 'dashed' },
        z: 10
      });

      var option = {
        title: {
          text: config.name + '超额收益曲线',
          subtext: '基准：' + data.benchmark,
          left: 'center',
          textStyle: { fontSize: 14 }
        },
        tooltip: {
          trigger: 'axis',
          formatter: function(params) {
            var html = params[0].axisValue + '<br/>';
            params.forEach(function(p) {
              html += p.marker + p.seriesName + ': ' + (p.value !== null && p.value !== undefined ? Number(p.value[1]).toFixed(2) + '%' : '-') + '<br/>';
            });
            return html;
          }
        },
        legend: {
          data: data.series.map(function(s) { return s.name; }).concat([data.benchmark]),
          bottom: 0,
          type: 'scroll'
        },
        grid: {
          left: '3%',
          right: '4%',
          bottom: '15%',
          top: '15%',
          containLabel: true
        },
        xAxis: {
          type: 'time',
          axisLabel: { rotate: 30 }
        },
        yAxis: {
          type: 'value',
          name: '超额收益率(%)',
          axisLine: { show: true },
          splitLine: { show: true }
        },
        series: series
      };

      myChart.setOption(option);
      window.echartsInstances.push(myChart);
      window.addEventListener('resize', function() { myChart.resize(); });
    }
  });
  </script>
</body>
</html>
