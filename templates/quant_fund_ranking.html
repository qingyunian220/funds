<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量化基金排名</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }
        
        .container {
            max-width: 100%;
            margin: 0 auto;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .header h1 {
            font-size: 24px;
            color: #333;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 8px 16px;
            background-color: #1e9fff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
        }
        
        .btn:hover {
            background-color: #0c80df;
        }
        
        .btn-secondary {
            background-color: #666;
        }
        
        .btn-secondary:hover {
            background-color: #555;
        }
        
        .card {
            background: white;
            border-radius: 4px;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05);
        }
        
        .card-header {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .card-header h2 {
            font-size: 16px;
            color: #333;
        }
        
        .card-body {
            padding: 20px;
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        
        th, td {
            padding: 12px 15px;
            text-align: center;
            border: 1px solid #eee;
            vertical-align: middle;
        }
        
        th {
            background-color: #f8f8f8;
            color: #666;
            font-weight: 600;
            white-space: nowrap;
        }
        
        th.sortable {
            cursor: pointer;
            user-select: none;
            position: relative;
            transition: background-color 0.2s;
        }
        
        th.sortable:hover {
            background-color: #eef6ff;
            color: #1e9fff;
        }
        
        th.sortable::after {
            content: '⇅';
            margin-left: 5px;
            opacity: 0.3;
            font-size: 12px;
        }
        
        th.sortable.sort-asc::after {
            content: '↑';
            opacity: 1;
            color: #1e9fff;
        }
        
        th.sortable.sort-desc::after {
            content: '↓';
            opacity: 1;
            color: #1e9fff;
        }
        
        tr:hover {
            background-color: #fafafa;
        }
        
        .positive-number {
            color: #ff5722;
            font-weight: 500;
        }
        
        .negative-number {
            color: #16b777;
            font-weight: 500;
        }
        
        a.fund-link {
            color: #1e9fff;
            text-decoration: none;
        }
        
        a.fund-link:hover {
            text-decoration: underline;
        }
        
        .mini-chart {
            width: 180px;
            height: 50px;
            display: inline-block;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            padding: 15px;
            border-top: 1px solid #eee;
        }
        
        .pagination button {
            padding: 6px 12px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .pagination button:hover:not(:disabled) {
            border-color: #1e9fff;
            color: #1e9fff;
        }
        
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .pagination .page-info {
            color: #666;
            font-size: 14px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <a href="/" class="btn btn-secondary">← 返回首页</a>
            </div>
            <h1>量化基金排名</h1>
            <div></div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h2>基金列表</h2>
                <div>
                    <!-- <button id="serverPdfBtn" class="btn btn-secondary" style="margin-right: 8px;">
                        <span>🖨️</span> 服务端导出PDF
                    </button> -->
                    <button id="pdfBtn" class="btn btn-secondary" style="margin-right: 8px;">
                        <span>📄</span> 导出PDF
                    </button>
                    <button id="screenshotBtn" class="btn">
                        <span>📸</span> 截图保存
                    </button>
                </div>
            </div>
            <div class="card-body" id="screenshot-area">
                <div id="table-container">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let allData = [];
        // 排序状态：{ key: '近1年超额', direction: 'asc' | 'desc' }
        let sortState = { key: null, direction: 'asc' };
        
        // 列配置：定义可排序列的取值方式
        const SORT_COLUMNS = {
            //'基金代码': { type: 'string', getter: r => r['基金代码'] || '' },
            // '基金简称': { type: 'string', getter: r => r['基金简称'] || '' },
            '近1月超额': { type: 'number', getter: r => parseFloat(r['近1月超额']) },
            '近3月超额': { type: 'number', getter: r => parseFloat(r['近3月超额']) },
            '近6月超额': { type: 'number', getter: r => parseFloat(r['近6月超额']) },
            '近1年超额': { type: 'number', getter: r => parseFloat(r['近1年超额']) },
            //'成立时间': { type: 'date', getter: r => {
            //    const v = r['成立时间'];
            //    if (!v) return 0;
            //    const t = Date.parse(String(v).replace(/-/g, '/'));
            //    return isNaN(t) ? 0 : t;
            //}},
            '最新规模': { type: 'number', getter: r => parseFloat(r['最新规模']) },
            '换手率': { type: 'number', getter: r => parseFloat(r['换手率']) },
            '前10大重仓股占比': { type: 'number', getter: r => parseFloat(r['前10大重仓股占比']) },
            '持股行业集中度': { type: 'number', getter: r => {
                const v = r['持股行业集中度'];
                if (!v) return NaN;
                const m = String(v).match(/(\d+\.?\d*)/);
                return m ? parseFloat(m[1]) : NaN;
            }},
            '管理总规模': { type: 'number', getter: r => parseFloat(r['管理总规模']) },
            '稳定性评分': { type: 'number', getter: r => parseFloat(r['稳定性评分']) }
        };
        
        // 页面加载时获取数据
        $(document).ready(function() {
            loadData();
        });
        
        // 加载数据
        function loadData() {
            $.ajax({
                url: '/get_quant_fund_data',
                type: 'GET',
                dataType: 'json',
                success: function(response) {
                    if (response && response.code === 0 && response.data) {
                        allData = response.data;
                        renderTable();
                    } else {
                        $('#table-container').html('<div class="loading">数据加载失败</div>');
                    }
                },
                error: function() {
                    $('#table-container').html('<div class="loading">数据加载失败</div>');
                }
            });
        }
        
        // 渲染表格
        function renderTable() {
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>序号</th>
                            <th  data-sort-key="基金代码">基金代码</th>
                            <th  data-sort-key="基金简称">基金简称</th>
                            <th class="sortable" data-sort-key="近1月超额">近1月超额</th>
                            <th class="sortable" data-sort-key="近3月超额">近3月超额</th>
                            <th class="sortable" data-sort-key="近6月超额">近6月超额</th>
                            <th class="sortable" data-sort-key="近1年超额">近1年超额</th>
                            <th data-sort-key="成立时间">成立时间</th>
                            <th class="sortable" data-sort-key="最新规模">最新规模</th>
                            <th class="sortable" data-sort-key="换手率">换手率</th>
                            <th class="sortable" data-sort-key="前10大重仓股占比">前10大重仓股占比</th>
                            <th class="sortable" data-sort-key="持股行业集中度">持股行业集中度</th>
                            <th class="sortable" data-sort-key="管理总规模">管理总规模</th>
                            <th>超额收益曲线</th>
                            <th class="sortable" data-sort-key="稳定性评分">稳定性评分</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            allData.forEach(function(row, index) {
                html += `<tr>`;
                html += `<td>${index + 1}</td>`;
                html += `<td><a href="https://fund.eastmoney.com/${row['基金代码']}.html" target="_blank" class="fund-link">${row['基金代码']}</a></td>`;
                html += `<td>${row['基金简称'] || ''}</td>`;
                // html += `<td>${formatPercent(row['近1月'])}</td>`;
                // html += `<td>${formatPercent(row['近3月'])}</td>`;
                // html += `<td>${formatPercent(row['近6月'])}</td>`;
                // html += `<td>${formatPercent(row['近1年'])}</td>`;
                html += `<td>${formatPercent(row['近1月超额'])}</td>`;
                html += `<td>${formatPercent(row['近3月超额'])}</td>`;
                html += `<td>${formatPercent(row['近6月超额'])}</td>`;
                html += `<td>${formatPercent(row['近1年超额'])}</td>`;
                html += `<td>${row['成立时间'] || ''}</td>`;
                html += `<td>${row['最新规模'] || ''}</td>`;
                html += `<td>${row['换手率'] || ''}</td>`;
                html += `<td>${row['前10大重仓股占比'] || ''}</td>`;
                html += `<td>${formatIndustryConcentration(row['持股行业集中度'])}</td>`;
                html += `<td>${row['管理总规模'] || ''}</td>`;
                html += `<td><div id="mini-chart-${row['基金代码']}" class="mini-chart" data-fund-code="${row['基金代码']}"></div></td>`;
                html += `<td>${formatStabilityScore(row['稳定性评分'])}</td>`;
                html += `</tr>`;
            });
            
            html += `
                    </tbody>
                </table>
            `;
            
            $('#table-container').html(html);
            
            // 恢复表头排序状态显示
            updateSortIndicators();
            
            // 绑定表头点击事件
            bindSortEvents();
            
            // 延迟渲染迷你图
            setTimeout(function() {
                renderMiniCharts(allData);
            }, 100);
        }
        
        // 绑定表头点击事件
        function bindSortEvents() {
            $('#table-container th.sortable').on('click', function() {
                const key = $(this).data('sort-key');
                if (!key || !SORT_COLUMNS[key]) return;
                
                if (sortState.key === key) {
                    sortState.direction = sortState.direction === 'asc' ? 'desc' : 'asc';
                } else {
                    sortState.key = key;
                    sortState.direction = 'desc';
                }
                
                sortData();
                renderTable();
            });
        }
        
        // 排序数据
        function sortData() {
            const col = SORT_COLUMNS[sortState.key];
            if (!col) return;
            const dir = sortState.direction === 'asc' ? 1 : -1;
            const getter = col.getter;
            
            allData.sort(function(a, b) {
                let va = getter(a);
                let vb = getter(b);
                
                if (col.type === 'number' || col.type === 'date') {
                    const na = isNaN(va) ? -Infinity : va;
                    const nb = isNaN(vb) ? -Infinity : vb;
                    return (na - nb) * dir;
                } else {
                    va = String(va || '');
                    vb = String(vb || '');
                    return va.localeCompare(vb, 'zh-CN') * dir;
                }
            });
        }
        
        // 更新表头排序状态指示
        function updateSortIndicators() {
            $('#table-container th.sortable').removeClass('sort-asc sort-desc');
            if (sortState.key) {
                const $th = $('#table-container th.sortable[data-sort-key="' + sortState.key + '"]');
                if ($th.length) {
                    $th.addClass(sortState.direction === 'asc' ? 'sort-asc' : 'sort-desc');
                }
            }
        }
        
        // 格式化百分比
        function formatPercent(value) {
            if (value === null || value === undefined || value === '') {
                return '';
            }
            const num = parseFloat(value);
            if (isNaN(num)) {
                return value;
            }
            const formatted = num.toFixed(2) + '%';
            if (num < 0) {
                return `<span class="negative-number">${formatted}</span>`;
            } else if (num > 0) {
                return `<span class="positive-number">${formatted}</span>`;
            }
            return formatted;
        }
        
        // 格式化行业集中度
        function formatIndustryConcentration(value) {
            if (!value) return '';
            const match = String(value).match(/(\d+\.\d+)%/);
            if (match && match[1]) {
                return match[1] + '%';
            }
            return value;
        }
        
        // 格式化稳定性评分
        function formatStabilityScore(value) {
            if (value === null || value === undefined || value === '') {
                return '';
            }
            const num = parseFloat(value);
            if (isNaN(num)) {
                return '';
            }
            let colorClass = '';
            if (num >= 70) {
                colorClass = 'positive-number';
            } else if (num < 30) {
                colorClass = 'negative-number';
            }
            const display = Math.round(num);
            if (colorClass) {
                return `<span class="${colorClass}">${display}</span>`;
            }
            return display;
        }
        
        // 渲染迷你图
        function renderMiniCharts(pageData) {
            console.log("=== 开始渲染迷你图 ===");
            console.log("需要渲染的基金数量:", pageData.length);
            
            pageData.forEach(function(row, index) {
                const fundCode = row['基金代码'];
                const chartId = `mini-chart-${fundCode}`;
                const chartDom = document.getElementById(chartId);
                
                if (!chartDom) {
                    console.log(`[${index}] 找不到DOM元素: ${chartId}`);
                    return;
                }
                
                // 如果图表已经存在，先销毁它
                if (chartDom._echarts_instance_) {
                    console.log(`[${index}] 销毁旧图表: ${chartId}`);
                    chartDom._echarts_instance_.dispose();
                    chartDom._echarts_instance_ = null;
                }
                
                console.log(`[${index}] 开始加载数据: ${fundCode}`);
                
                // 获取数据，添加时间戳防止缓存
                $.ajax({
                    url: `/get_excess_curve/${fundCode}?t=${Date.now()}`,
                    type: 'GET',
                    dataType: 'json',
                    cache: false,
                    success: function(response) {
                        console.log(`[${index}] ${fundCode} 数据返回:`, response);
                        
                        if (response && response.code === 0 && response.data && Array.isArray(response.data) && response.data.length > 0) {
                            const data = response.data;
                            const dates = data.map(item => item.date);
                            const returns = data.map(item => item.excess_return * 100);
                            
                            console.log(`[${index}] ${fundCode} 解析结果: ${dates.length}个点`);
                            console.log(`[${index}] ${fundCode} 前3个点:`, returns.slice(0, 3));
                            console.log(`[${index}] ${fundCode} 后3个点:`, returns.slice(-3));
                            
                            const lastValue = returns.length > 0 ? returns[returns.length - 1] : 0;
                            const lineColor = lastValue >= 0 ? '#ff5722' : '#16b777';
                            
                            console.log(`[${index}] ${fundCode} 最终超额: ${lastValue.toFixed(2)}%, 颜色: ${lineColor}`);
                            
                            const myChart = echarts.init(chartDom);
                            
                            const option = {
                                animation: false,
                                grid: {
                                    left: 0,
                                    right: 0,
                                    top: 0,
                                    bottom: 0
                                },
                                xAxis: {
                                    type: 'category',
                                    data: dates,
                                    show: false,
                                    boundaryGap: false
                                },
                                yAxis: {
                                    type: 'value',
                                    show: false,
                                    scale: true,
                                    min: 'dataMin',
                                    max: 'dataMax'
                                },
                                series: [{
                                    data: returns,
                                    type: 'line',
                                    smooth: 0.2,
                                    symbol: 'none',
                                    lineStyle: {
                                        color: lineColor,
                                        width: 1.2
                                    },
                                    areaStyle: {
                                        color: {
                                            type: 'linear',
                                            x: 0,
                                            y: 0,
                                            x2: 0,
                                            y2: 1,
                                            colorStops: [{
                                                offset: 0,
                                                color: lineColor + '25'
                                            }, {
                                                offset: 1,
                                                color: lineColor + '08'
                                            }]
                                        }
                                    }
                                }]
                            };
                            
                            myChart.setOption(option, true); // 强制不合并
                            chartDom._echarts_instance_ = myChart;
                            console.log(`[${index}] ${fundCode} 图表渲染完成`);
                        } else {
                            console.log(`[${index}] ${fundCode} 数据为空，不渲染图表`);
                            // 清空容器
                            chartDom.innerHTML = '';
                        }
                    },
                    error: function(xhr, status, error) {
                        console.error(`[${index}] ${fundCode} 请求失败:`, error);
                        chartDom.innerHTML = '';
                    }
                });
            });
        }
        
        // 截图功能
        $('#screenshotBtn').on('click', function() {
            const btn = $(this);
            const originalText = btn.html();
            btn.html('<span>⏳</span> 正在截图...');
            btn.attr('disabled', true);
            
            const element = document.getElementById('screenshot-area');
            
            html2canvas(element, {
                scale: 2,
                useCORS: true,
                allowTaint: true,
                backgroundColor: '#ffffff'
            }).then(function(canvas) {
                const link = document.createElement('a');
                const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                link.download = '量化基金排名_' + timestamp + '.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                btn.html(originalText);
                btn.attr('disabled', false);
                
                alert('截图保存成功！');
            }).catch(function(error) {
                console.error('截图失败:', error);
                btn.html(originalText);
                btn.attr('disabled', false);
                alert('截图失败，请重试');
            });
        });

        // 服务端 PDF 导出（适用于超长表格，数据量较大时更快）
        $('#serverPdfBtn').on('click', function() {
            const btn = $(this);
            const originalText = btn.html();
            btn.html('<span>⏳</span> 正在服务端生成PDF...');
            btn.attr('disabled', true);

            // 直接在新窗口请求 PDF 路由
            const win = window.open('/export_pdf?t=' + Date.now(), '_blank');

            setTimeout(function() {
                btn.html(originalText);
                btn.attr('disabled', false);
                if (!win || win.closed) {
                    alert('弹出窗口被浏览器拦截，请允许弹窗后重试，或改用"导出PDF"按钮');
                }
            }, 500);
        });

        // PDF 导出功能（不分页，自适应单页）
        $('#pdfBtn').on('click', function() {
            const btn = $(this);
            const originalText = btn.html();
            btn.html('<span>⏳</span> 正在生成PDF...');
            btn.attr('disabled', true);

            const element = document.getElementById('screenshot-area');

            html2canvas(element, {
                scale: 2,
                useCORS: true,
                allowTaint: true,
                backgroundColor: '#ffffff',
                windowWidth: element.scrollWidth
            }).then(function(canvas) {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pdfWidth = 210;
                const pdfHeight = 297;
                const margin = 8;
                const contentWidth = pdfWidth - margin * 2;
                const contentHeight = pdfHeight - margin * 2;

                const imgRatio = canvas.width / canvas.height;
                const pageRatio = contentWidth / contentHeight;

                let finalWidth, finalHeight;
                if (imgRatio > pageRatio) {
                    finalWidth = contentWidth;
                    finalHeight = contentWidth / imgRatio;
                } else {
                    finalHeight = contentHeight;
                    finalWidth = contentHeight * imgRatio;
                }

                const x = (pdfWidth - finalWidth) / 2;
                const y = (pdfHeight - finalHeight) / 2;

                const imgData = canvas.toDataURL('image/jpeg', 0.95);
                pdf.addImage(imgData, 'JPEG', x, y, finalWidth, finalHeight);

                const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                pdf.save('量化基金排名_' + timestamp + '.pdf');

                btn.html(originalText);
                btn.attr('disabled', false);
            }).catch(function(error) {
                console.error('PDF 导出失败:', error);
                btn.html(originalText);
                btn.attr('disabled', false);
                alert('PDF 导出失败，请重试');
            });
        });
    </script>
</body>
</html>
